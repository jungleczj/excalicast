name: Release macOS desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (must match desktop-vX.Y.Z or desktop-vX.Y.Z-beta.N)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-desktop-release-${{ github.ref_name }}-${{ inputs.release_tag || 'tag' }}
  cancel-in-progress: false

jobs:
  build-sign-notarize-release:
    name: Build, sign, notarize, and publish arm64 DMG
    runs-on: macos-15
    environment: macos-production
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || github.event_name != 'workflow_dispatch' && contains(github.ref_name, '-') }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set desktop bundle version from release tag
        shell: bash
        run: |
          set -euo pipefail
          desktop_version="${RELEASE_TAG#desktop-v}"
          npm version "$desktop_version" --no-git-tag-version --allow-same-version

      - name: Verify desktop TypeScript and native contracts
        run: |
          npm run desktop:typecheck
          npm run desktop:native:test

      - name: Build arm64 native media engine
        shell: bash
        run: |
          set -euo pipefail
          swift build \
            --configuration release \
            --triple arm64-apple-macosx \
            --package-path native/mac-media-engine \
            --scratch-path native/mac-media-engine/.build-ci
          mkdir -p apps/desktop/build/bin
          cp \
            native/mac-media-engine/.build-ci/arm64-apple-macosx/release/mac-media-engine \
            apps/desktop/build/bin/mac-media-engine
          chmod 755 apps/desktop/build/bin/mac-media-engine
          file apps/desktop/build/bin/mac-media-engine | grep -q "arm64"

      - name: Prepare Developer ID signing and notarization credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          required_secrets=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required macOS release secret is missing: $secret_name" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/excalicast-developer-id.p12"
          api_key_path="$RUNNER_TEMP/excalicast-notary-key.p8"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

      - name: Build signed and notarized arm64 DMG
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ runner.temp }}/excalicast-developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/excalicast-notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          npm run desktop:build
          npx electron-builder --mac dmg --arm64 --publish never

      - name: Notarize and staple the DMG container
        shell: bash
        env:
          APPLE_API_KEY: ${{ runner.temp }}/excalicast-notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg_path="dist-desktop/Excalicast-mac-arm64.dmg"
          test -f "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Verify signature, notarization, and fixed artifact name
        shell: bash
        run: |
          set -euo pipefail
          app_path="dist-desktop/mac-arm64/Excalicast.app"
          dmg_path="dist-desktop/Excalicast-mac-arm64.dmg"

          test -d "$app_path"
          test -f "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q "Authority=Developer ID Application:"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"

          dmg_count="$(find dist-desktop -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "$dmg_count" != "1" ]]; then
            echo "Expected exactly one DMG, found $dmg_count" >&2
            exit 1
          fi

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist-desktop
          shasum -a 256 Excalicast-mac-arm64.dmg > SHA256SUMS.txt
          shasum -a 256 --check SHA256SUMS.txt

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excalicast-mac-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist-desktop/Excalicast-mac-arm64.dmg
            dist-desktop/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist-desktop/Excalicast-mac-arm64.dmg
            dist-desktop/SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            release_flags=()
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Excalicast Desktop $RELEASE_TAG" \
              --generate-notes \
              "${release_flags[@]}"
          fi

      - name: Remove local signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/excalicast-developer-id.p12" \
            "$RUNNER_TEMP/excalicast-notary-key.p8"
