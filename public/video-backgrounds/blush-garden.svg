      <ellipse cx="206" cy="118" rx="72" ry="28" fill="#5DA76B" opacity=".38" transform="rotate(28 206 118)"/>
      <ellipse cx="334" cy="164" rx="82" ry="31" fill="#8DC990" opacity=".44" transform="rotate(-20 334 164)"/>
      <circle cx="252" cy="138" r="48" fill="url(#petal)"/>
      <circle cx="290" cy="175" r="34" fill="#FFB6C6" opacity=".62"/>
      <circle cx="382" cy="193" r="42" fill="#F6A0B4" opacity=".52"/>
    </g>
