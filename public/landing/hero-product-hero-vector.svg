      .thin{fill:none;stroke:#17191b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .tool{fill:none;stroke:#25282b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .label{fill:#17191b}
    </style>
  </defs>

