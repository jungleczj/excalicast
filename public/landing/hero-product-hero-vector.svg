<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 470" role="img" aria-label="Excalicast recording workspace preview">
  <defs>
    <filter id="shellShadow" x="-7%" y="-14%" width="114%" height="132%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a2118" flood-opacity=".16"/>
    </filter>
    <filter id="softShadow" x="-18%" y="-24%" width="136%" height="148%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2a2118" flood-opacity=".14"/>
    </filter>
    <filter id="inkWobble" x="-5%" y="-7%" width="110%" height="114%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="1" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale=".42"/>
    </filter>
    <pattern id="paperGrain" width="120" height="120" patternUnits="userSpaceOnUse">
